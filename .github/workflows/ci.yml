name: Go4Guru CI Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality-and-tests:
    name: Backend API Quality, Boundaries & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: go4guru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API and Worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e "../worker[dev]"
      - name: Ruff lint and format check
        run: |
          ruff check src tests ../worker/src ../worker/tests
          ruff format --check src tests ../worker/src ../worker/tests
      - name: Mypy strict typecheck
        run: mypy src
      - name: Verify modular monolith import boundaries
        run: lint-imports
      - name: Run Alembic migrations and API/Worker test suites
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:ci_postgres_password@127.0.0.1:5432/go4guru_test
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-only-secret-key-must-be-at-least-32-characters-long
        run: |
          alembic upgrade head
          pytest -v tests ../worker/tests

  web-quality-and-tests:
    name: Frontend Packages, Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Build shared workspace packages
        run: |
          pnpm --filter @go4guru/contracts build
          pnpm --filter @go4guru/whiteboard-schema build
          pnpm --filter @go4guru/ui build
      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_WS_BASE_URL: ws://127.0.0.1:8000
          NEXT_PUBLIC_APP_ENV: test
        run: pnpm --filter @go4guru/web build
