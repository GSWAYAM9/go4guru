[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "go4guru-api"
version = "0.1.0"
description = "Go4Guru modular monolith API backend (Phase 0 foundation)"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=23.1.0",
  "asyncpg>=0.30.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "openpyxl>=3.1.5",
  "pint>=0.26.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "PyJWT>=2.9.0",
  "pyotp>=2.9.0",
  "python-multipart>=0.0.17",
  "redis>=5.2.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "sympy>=1.14.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "asgi-lifespan>=2.1.0",
  "httpx>=0.27.0",
  "import-linter>=2.1",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "types-openpyxl>=3.1.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["src"]

[[tool.mypy.overrides]]
module = ["alembic.*", "sympy", "sympy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Modular monolith layering"
type = "layers"
layers = [
  "src.main",
  "src.modules",
  "src.core",
]

[[tool.importlinter.contracts]]
name = "Domain module boundary independence (via public.py only)"
type = "independence"
modules = [
  "src.modules.identity",
  "src.modules.organization",
  "src.modules.curriculum",
  "src.modules.content",
  "src.modules.question_bank",
  "src.modules.assessment",
  "src.modules.learning",
  "src.modules.revision",
  "src.modules.ai",
  "src.modules.classroom",
  "src.modules.homework",
  "src.modules.teacher",
  "src.modules.mentor",
  "src.modules.billing",
  "src.modules.analytics",
  "src.modules.notifications",
]
ignore_imports = [
  "src.modules.** -> src.modules.*.public",
]
